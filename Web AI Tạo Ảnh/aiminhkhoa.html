<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI MKHOME - Thiết Kế Nhà & Nội Thất</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Nút chọn giao diện -->
        <div class="ui-toggle" style="position:absolute;top:18px;right:24px;z-index:10;display:flex;gap:8px;">
            <button id="desktop-mode-btn" title="Chế độ máy tính" type="button" style="background:none;border:none;cursor:pointer;padding:4px;">
                <!-- Desktop icon -->
                <svg width="24" height="24" fill="none" stroke="#6366f1" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </button>
            <button id="mobile-mode-btn" title="Chế độ mobile" type="button" style="background:none;border:none;cursor:pointer;padding:4px;">
                <!-- Mobile icon -->
                <svg width="22" height="22" fill="none" stroke="#06b6d4" stroke-width="2" viewBox="0 0 22 22"><rect x="6" y="2" width="10" height="18" rx="2"/><circle cx="11" cy="18" r="1"/></svg>
            </button>
        </div>
        <header>
            <img src="https://img.icons8.com/ios-filled/100/4f46e5/blueprint.png" alt="Logo" class="logo">
            <h1 class="main-title">
                <span class="brand-gradient">AI MKHOME</span>
            </h1>
            <p class="subtitle">
                Nền tảng AI chuyên nghiệp tạo hình ảnh sáng tạo cho thiết kế, quảng cáo, nhận diện thương hiệu và nhiều lĩnh vực khác.
            </p>
        </header>
        <form id="ai-form">
            <div class="form-group">
                <label>
                    Chọn AI:
                    <span class="form-note">(Chọn server AI để tạo ảnh)</span>
                </label>
                <select name="ai_server" id="ai-server" required>
                    <option value="server1">Sever 1</option>
                    <option value="server2">Sever 2</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    Khung thời gian:
                    <span class="form-note">(Chọn thời điểm trong ngày cho bức ảnh)</span>
                </label>
                <select name="time_frame" id="time-frame">
                    <option value="">-- Chọn khung thời gian --</option>
                    <option value="in the morning">Sáng</option>
                    <option value="at noon">Trưa</option>
                    <option value="at sunset">Hoàng Hôn</option>
                    <option value="at sunrise">Bình Minh</option>
                    <option value="at night">Tối</option>
                </select>
            </div>
            <div class="form-group">
                <label>
                    Chủ đề:
                    <span class="form-note">(Chọn loại thiết kế bạn muốn AI tạo: mặt tiền, biệt thự, nội thất, cảnh quan...)</span>
                </label>
                <select name="topic" required>
                    <optgroup label="Kiến trúc ngoại thất">
                        <option value="modern house exterior">Mặt tiền nhà ở hiện đại</option>
                        <option value="classic house exterior">Mặt tiền nhà ở cổ điển</option>
                        <option value="modern villa exterior">Biệt thự hiện đại</option>
                        <option value="classic villa exterior">Biệt thự cổ điển</option>
                        <option value="townhouse exterior">Nhà phố</option>
                        <option value="resort villa exterior">Villa nghỉ dưỡng</option>
                        <option value="landscape garden">Cảnh quan sân vườn</option>
                    </optgroup>
                    <optgroup label="Nội thất">
                        <option value="interior of a modern living room, wide angle, ultra realistic, 8k">Nội thất phòng khách</option>
                        <option value="interior of a modern bedroom, wide angle, ultra realistic, 8k">Nội thất phòng ngủ</option>
                        <option value="interior of a modern kitchen, wide angle, ultra realistic, 8k">Nội thất phòng bếp</option>
                        <option value="interior of a modern bathroom, wide angle, ultra realistic, 8k">Nội thất phòng tắm</option>
                        <option value="interior of a modern office, wide angle, ultra realistic, 8k">Nội thất văn phòng</option>
                        <option value="interior of a modern cafe, wide angle, ultra realistic, 8k">Nội thất quán cafe</option>
                        <option value="interior of a modern restaurant, wide angle, ultra realistic, 8k">Nội thất nhà hàng</option>
                    </optgroup>
                    <optgroup label="Khác">
                        <option value="green architecture">Kiến trúc xanh</option>
                        <option value="container house">Nhà container</option>
                        <option value="tiny house">Tiny house</option>
                        <option value="homestay">Homestay</option>
                        <option value="resort">Resort</option>
                    </optgroup>
                    <optgroup label="Bảng hiệu & Logo">
                        <option value="signboard design, shopfront sign, creative, high quality, vector">Bảng hiệu</option>
                        <option value="signboard design for coffee shop, creative, high quality, vector">Bảng hiệu quán cafe</option>
                        <option value="signboard design for restaurant, creative, high quality, vector">Bảng hiệu nhà hàng</option>
                        <option value="logo design, creative, minimal, vector, branding">Logo</option>
                        <option value="company logo design, professional, minimal, vector, branding">Logo công ty</option>
                        <option value="logo design for food shop, creative, minimal, vector, branding">Logo quán ăn</option>
                    </optgroup>
                    <optgroup label="Anime/Hoạt Hình">
                        <option value="anime style portrait, vibrant, high quality">Anime</option>
                        <option value="cartoon style portrait, colorful, high quality">Hoạt hình</option>
                    </optgroup>
                    <optgroup label="Ảnh Chibi">
                        <option value="chibi style portrait, cute, colorful, high quality">Chibi</option>
                    </optgroup>
                    <optgroup label="Con người">
                        <option value="portrait photo of a young woman, ultra realistic, 8k">Chân dung phụ nữ</option>
                        <option value="portrait photo of a young man, ultra realistic, 8k">Chân dung nam</option>
                        <option value="group photo of happy family, ultra realistic, 8k">Gia đình</option>
                        <option value="fashion model, full body, street style, ultra realistic, 8k">Người mẫu thời trang</option>
                        <option value="child portrait, cute, ultra realistic, 8k">Chân dung trẻ em</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group">
                <label>Mô tả ý tưởng:</label>
                <textarea name="prompt" required placeholder="Nhập mô tả ý tưởng thiết kế..."></textarea>
            </div>
            <button type="submit">✨ Tạo Ảnh</button>
        </form>
        <div id="result">
            <div class="result-title">Kết quả AI:</div>
            <div class="result-images">
                <div class="result-image" id="result-image-1">
                    <!-- Ảnh AI sẽ hiển thị ở đây -->
                </div>
                <div id="result-url" style="margin-top:12px; word-break:break-all; text-align:center; font-size:0.98em; color:#6366f1;"></div>
                <div id="download-buttons">
                    <button id="download-watermark" type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" style="margin-right:4px;vertical-align:middle;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
                        Tải Xuống
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Phần giới thiệu tác giả -->
    <div style="text-align:center; margin: 24px 0 0 0; font-size: 1em; color: #555;">
        Được phát triển bởi <strong>Trần Minh Khoa</strong> - <a href="mailto:khoaminhtran9@gmail.com" style="color:#4f46e5;text-decoration:underline;">khoaminhtran9@gmail.com</a>
    </div>
    <footer>
        <p>© 2024 <span class="brand-gradient">AI MKHOME</span> | Powered by AI</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
